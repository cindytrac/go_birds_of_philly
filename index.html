<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <title>Go Birds of Philly</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
        crossorigin=""
    >
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css">
    <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>

    <a class="skip-link" href="#map">Skip to main content</a>

    <dialog id="welcome-screen" class="welcome-screen" aria-labelledby="welcome-title">
        <img src="images/bird.png" alt="" width="64" height="64">
        <h2 id="welcome-title">Go Birds!
        </h2>
        <p>Philly is home to more than just the Eagles. Listen to bird recordings from across Philadelphia.</p>
        <p></p>
        <button id="enter-map" type="button">Explore the Map</button>
    </dialog>

    <main id="map" aria-label="Map of bird recordings in Philadelphia" tabindex="-1"></main>

    <script
        src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
        crossorigin=""
    ></script>
    <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
    <script src="https://unpkg.com/leaflet-curve@1.0.0/leaflet.curve.js"></script>
    <script src="js/config.js"></script>
    <script type="module" src="js/map.js"></script>

</body>

</html>
